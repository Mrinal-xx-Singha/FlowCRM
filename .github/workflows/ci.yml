name: FlowCRM CI Pipeline

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test-server:
    name: Backend Tests & Build
    runs-on: ubuntu-latest

    # Spin up a real PostgreSQL database inside GitHub Actions
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./server

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "./server/package-lock.json"

      - name: Install Dependencies
        run: npm ci

      - name: Run Integration Tests
        run: npm test
        env:
          NODE_ENV: test
          TEST_DATABASE_URL: postgresql://postgres:password@localhost:5432/crm_test
          DATABASE_URL: postgresql://postgres:password@localhost:5432/crm_test
          JWT_SECRET: test_jwt_secret_key_12345

      - name: Compile TypeScript
        run: npm run build

  build-client:
    name: Frontend Next.js Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "./client/package-lock.json"

      - name: Install Dependencies
        run: npm ci
      - name: Build Next.js Production Bundle
        run: npm run build